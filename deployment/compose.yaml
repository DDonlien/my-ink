name: ink-loom

services:
  ink-loom-web:
    image: caddy:2.10.2-alpine
    container_name: ink-loom-web
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    # The image's Caddy executable carries this Linux file capability.
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./www:/srv:ro
    networks:
      - gateway
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  gateway:
    external: true
    name: gitea_default
